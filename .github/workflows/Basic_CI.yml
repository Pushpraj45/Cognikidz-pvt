name: Basic CI (Deprecated)

# This workflow is deprecated and replaced by ci-cd.yml
# Keeping for reference but disabling automatic triggers

on:
  workflow_dispatch: # Manual trigger only
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main

env:
  TZ: Asia/Kolkata # Set timezone to IST (India Standard Time)

jobs:
  frontend-checks:
    name: Frontend Validation
    runs-on: ubuntu-latest
    continue-on-error: true # Allow merging even if frontend checks fail
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Check dependencies
        run: npm ls --depth=0

      # Lint check removed - temporarily disabled
      # - name: Lint check
      #   continue-on-error: true
      #   run: npm run lint

      - name: Prettier check
        continue-on-error: true
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,scss,md}"

  backend-checks:
    name: Backend Validation
    runs-on: ubuntu-latest
    continue-on-error: true # Allow merging even if backend checks fail
    defaults:
      run:
        working-directory: ./backend
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm install

      - name: Check dependencies
        run: npm ls --depth=0

      # Lint check removed - temporarily disabled
      # - name: Lint check
      #   continue-on-error: true
      #   run: npm run lint

      - name: Run tests
        continue-on-error: true
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          NODE_ENV: test

  merge-status:
    name: Always Successful Status Check
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks]
    # This job will always run and succeed, providing a passing status check
    if: always()
    steps:
      - name: Mark workflow as successful
        run: echo "Workflow checks completed, PR can be merged regardless of results"

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [merge-status]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send direct notification
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            # Get repository and commit information
            REPO="${{ github.repository }}"
            BRANCH="${{ github.ref_name }}"
            AUTHOR="${{ github.actor }}"
            COMMIT_MSG="$(git log -1 --pretty=format:'%s')"
            
            # Create a simple text-based notification payload
            PAYLOAD="{\"text\":\"CI Workflow: $WORKFLOW_STATUS\\nRepository: $REPO\\nBranch: $BRANCH\\nAuthor: $AUTHOR\\nCommit: $COMMIT_MSG\\nDetails: https://github.com/$REPO/actions/runs/${{ github.run_id }}\"}"
            
            # Send notification
            RESPONSE=$(curl -s -w "\\n%{http_code}" -X POST \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$WEBHOOK_URL")
            
            STATUS_CODE=$(echo "$RESPONSE" | tail -n1)
            RESPONSE_BODY=$(echo "$RESPONSE" | sed '$ d')
            
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "Notification sent successfully"
            else
              echo "Error sending notification: $STATUS_CODE - $RESPONSE_BODY"
            fi
          else
            echo "Webhook URL not configured, skipping notification"
          fi
