name: Google Chat Notifications

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened, review_requested]
  issues:
    types: [opened, closed, reopened]
  workflow_run:
    workflows: ["Basic CI"]
    types: [completed]
  deployment:
  deployment_status:

env:
  TZ: Asia/Kolkata # Set timezone to IST (India Standard Time)

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Debug workflow event
        if: github.event_name == 'workflow_run'
        run: |
          echo "Workflow event triggered"
          echo "Workflow name: ${{ github.event.workflow_run.name }}"
          echo "Workflow conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Workflow URL: ${{ github.event.workflow_run.html_url }}"
          echo "Repository: ${{ github.repository }}"

      - name: Send notification
        uses: actions/github-script@v6
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        with:
          script: |
            const { WEBHOOK_URL } = process.env;
            const { eventName, payload, actor } = context;

            // Helper function to create badges
            function createBadge(text, backgroundColor, textColor = "#FFFFFF", icon = "") {
              return `<font color="${textColor}"><b><span style="background-color:${backgroundColor};padding:4px 8px;border-radius:12px">${icon ? icon + " " : ""}${text}</span></b></font>`;
            }

            // Advanced card creation with improved formatting
            function createCard(title, subtitle, details, color, buttons = [], avatar = null) {
              const avatarUrl = avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(actor)}&background=${color.replace('#', '')}&color=fff&size=128`;
              
              // Create a formatted header with larger icon and title
              const formattedTitle = title.startsWith('<') ? title : `<b><font color="${color}" size="5">${title}</font></b>`;
              
              // Add sections with dividers and improved formatting
              const widgets = details.map(([label, value], index) => {
                const formattedValue = value && typeof value === 'string' && value.startsWith('<') 
                  ? value 
                  : `<b>${value || "N/A"}</b>`;
                
                return {
                  keyValue: {
                    topLabel: `<font color="#666666">${label}</font>`,
                    content: formattedValue,
                    contentMultiline: true,
                    onClick: label === 'Commit Message' && buttons.length > 0 ? { openLink: { url: buttons[0].textButton.onClick.openLink.url } } : undefined,
                    icon: getIconForLabel(label)
                  }
                };
              });
              
              return {
                cards: [{
                  header: {
                    title: formattedTitle,
                    subtitle: `<i>${subtitle}</i>`,
                    imageUrl: avatarUrl,
                    imageStyle: "AVATAR"
                  },
                  sections: [
                    {
                      header: "<b>📋 DETAILS</b>",
                      widgets: widgets
                    },
                    {
                      widgets: buttons.length ? [{ 
                        buttons: buttons.map(btn => ({
                          ...btn,
                          textButton: {
                            ...btn.textButton,
                            text: `<b>${btn.textButton.text}</b>`
                          }
                        }))
                      }] : []
                    }
                  ]
                }]
              };
            }

            // Get appropriate icon for different labels
            function getIconForLabel(label) {
              const iconMap = {
                'Author': 'PERSON',
                'Triggered by': 'PERSON',
                'Assignees': 'PERSON',
                'Timestamp': 'CLOCK',
                'Created': 'CLOCK',
                'Updated': 'CLOCK',
                'Started': 'CLOCK',
                'Completed': 'CLOCK',
                'Duration': 'CLOCK',
                'Commit': 'DESCRIPTION',
                'Commit Message': 'DESCRIPTION',
                'Commit ID': 'BOOKMARK',
                'Description': 'DESCRIPTION',
                'Status': 'STAR',
                'Branch': 'FLIGHT_TAKEOFF',
                'Changed Files': 'DESCRIPTION',
                'Event': 'EVENT_NOTE'
              };
              
              return iconMap[label] || null;
            }

            function formatTimestamp(timestamp) {
              if (!timestamp) return "N/A";
              const date = new Date(timestamp);
              return date.toLocaleString('en-US', { 
                weekday: 'short',
                month: 'short', 
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
              });
            }

            function formatDuration(milliseconds) {
              const seconds = Math.floor(milliseconds / 1000);
              if (seconds < 60) return `${seconds} seconds`;
              
              const minutes = Math.floor(seconds / 60);
              const remainingSeconds = seconds % 60;
              
              if (minutes < 60) {
                return `${minutes}m ${remainingSeconds}s`;
              }
              
              const hours = Math.floor(minutes / 60);
              const remainingMinutes = minutes % 60;
              
              return `${hours}h ${remainingMinutes}m ${remainingSeconds}s`;
            }

            let message = { text: `GitHub Event: ${eventName}` };

            if (eventName === 'push') {
              const commit = payload.head_commit;
              const commitAuthor = commit.author || { name: "Unknown", email: "unknown" };
              const filesChanged = payload.commits.reduce((sum, c) => sum + (c.added || []).length + (c.modified || []).length + (c.removed || []).length, 0);
              
              const statusBadge = createBadge("PUSH", "#4285F4", "#FFFFFF", "📦");
              
              message = createCard(
                `${statusBadge} ${payload.repository.full_name}`,
                `Branch: <b>${payload.ref.replace('refs/heads/', '')}</b>`,
                [
                  ['Author', `${commitAuthor.name} <font color="#666666">(${commitAuthor.email})</font>`],
                  ['Timestamp', formatTimestamp(commit.timestamp)],
                  ['Commit ID', `<font face="monospace">${commit.id.substring(0, 8)}</font>`],
                  ['Commit Message', commit.message],
                  ['Changed Files', `<b>${filesChanged}</b> ${filesChanged === 1 ? 'file' : 'files'} ${generateFileChangesBar(payload.commits)}`]
                ],
                '#4285F4',
                [
                  {
                    textButton: {
                      text: "📄 VIEW COMMITS",
                      onClick: { openLink: { url: commit.url } }
                    }
                  },
                  {
                    textButton: {
                      text: "🔍 VIEW REPOSITORY",
                      onClick: { openLink: { url: payload.repository.html_url } }
                    }
                  }
                ],
                commitAuthor.avatar_url
              );
            }

            else if (eventName === 'pull_request') {
              const pr = payload.pull_request;
              const color = payload.action === 'closed'
                ? (pr.merged ? '#8250DF' : '#EA4335')
                : '#0969DA';
              
              let statusText, statusIcon;
              if (payload.action === 'opened') {
                statusText = "OPENED";
                statusIcon = "🆕";
              } else if (payload.action === 'closed' && pr.merged) {
                statusText = "MERGED";
                statusIcon = "🔄";
              } else if (payload.action === 'closed') {
                statusText = "CLOSED";
                statusIcon = "❌";
              } else if (payload.action === 'reopened') {
                statusText = "REOPENED";
                statusIcon = "🔄";
              } else if (payload.action === 'review_requested') {
                statusText = "REVIEW REQUESTED";
                statusIcon = "👀";
              } else {
                statusText = payload.action.toUpperCase();
                statusIcon = "📝";
              }
              
              const statusBadge = createBadge(statusText, color, "#FFFFFF", statusIcon);
              
              let additionalInfo = [];
              if (payload.action === 'review_requested') {
                additionalInfo.push(['Reviewer', payload.requested_reviewer ? `<b>@${payload.requested_reviewer.login}</b>` : 'Team review']);
              }
              
              // Create a visual diff stat display
              const diffStats = `+<font color="#2cbe4e">${pr.additions}</font> -<font color="#cb2431">${pr.deletions}</font>`;
              
              message = createCard(
                `${statusBadge} PR #${pr.number}`,
                pr.title,
                [
                  ['Author', `<b>@${pr.user.login}</b>`],
                  ['Created', formatTimestamp(pr.created_at)],
                  ['Updated', formatTimestamp(pr.updated_at)],
                  ['Status', pr.merged ? createBadge('Merged', '#8250DF', '#FFFFFF', '✅') : 
                             (pr.state === 'closed' ? createBadge('Closed', '#EA4335', '#FFFFFF', '❌') : 
                             createBadge('Open', '#0969DA', '#FFFFFF', '🔄'))],
                  ['Additions/Deletions', diffStats + generateDiffBar(pr.additions, pr.deletions)],
                  ['Changed Files', `${pr.changed_files} ${pr.changed_files === 1 ? 'file' : 'files'}`],
                  ['Description', (pr.body && pr.body.length > 300) ? pr.body.substring(0, 300) + '...' : (pr.body || 'No description')],
                  ...additionalInfo
                ],
                color,
                [
                  {
                    textButton: {
                      text: "🔍 OPEN PR",
                      onClick: { openLink: { url: pr.html_url } }
                    }
                  },
                  {
                    textButton: {
                      text: "📊 VIEW CHANGES",
                      onClick: { openLink: { url: `${pr.html_url}/files` } }
                    }
                  }
                ],
                pr.user.avatar_url
              );
            }

            else if (eventName === 'issues') {
              const issue = payload.issue;
              const color = issue.state === 'closed' ? '#8250DF' : '#0969DA';
              
              let statusText, statusIcon;
              if (payload.action === 'opened') {
                statusText = "OPENED";
                statusIcon = "🆕";
              } else if (payload.action === 'closed') {
                statusText = "CLOSED";
                statusIcon = "✅";
              } else if (payload.action === 'reopened') {
                statusText = "REOPENED";
                statusIcon = "🔄";
              } else {
                statusText = payload.action.toUpperCase();
                statusIcon = "📝";
              }
              
              const statusBadge = createBadge(statusText, color, "#FFFFFF", statusIcon);
              
              let assigneeInfo = 'None';
              if (issue.assignees && issue.assignees.length > 0) {
                assigneeInfo = issue.assignees.map(a => `<b>@${a.login}</b>`).join(', ');
              }
              
              let labelsInfo = 'None';
              if (issue.labels && issue.labels.length > 0) {
                labelsInfo = issue.labels.map(l => 
                  createBadge(l.name, `#${l.color || '0366d6'}`, getContrastColor(`#${l.color || '0366d6'}`))
                ).join(' ');
              }
              
              message = createCard(
                `${statusBadge} Issue #${issue.number}`,
                issue.title,
                [
                  ['Author', `<b>@${issue.user.login}</b>`],
                  ['Created', formatTimestamp(issue.created_at)],
                  ['Updated', formatTimestamp(issue.updated_at)],
                  ['Status', createBadge(issue.state.toUpperCase(), issue.state === 'closed' ? '#8250DF' : '#0969DA', '#FFFFFF')],
                  ['Assignees', assigneeInfo],
                  ['Labels', labelsInfo],
                  ['Description', (issue.body && issue.body.length > 300) ? issue.body.substring(0, 300) + '...' : (issue.body || 'No description')]
                ],
                color,
                [
                  {
                    textButton: {
                      text: "🔍 VIEW ISSUE",
                      onClick: { openLink: { url: issue.html_url } }
                    }
                  },
                  {
                    textButton: {
                      text: "📊 VIEW PROJECT",
                      onClick: { openLink: { url: payload.repository.html_url } }
                    }
                  }
                ],
                issue.user.avatar_url
              );
            }

            else if (eventName === 'workflow_run') {
              const wf = payload.workflow_run;
              const color = wf.conclusion === 'success' ? '#2CBE4E' : (wf.conclusion === 'failure' ? '#EA4335' : '#F0B400');
              const icon = wf.conclusion === 'success' ? '✅' : (wf.conclusion === 'failure' ? '❌' : '⚠️');
              const actor = wf.actor || { login: "Unknown" };
              
              const durationMs = new Date(wf.updated_at) - new Date(wf.created_at);
              const formattedDuration = formatDuration(durationMs);
              
              // Create status badge based on conclusion
              const statusBadge = createBadge(wf.conclusion.toUpperCase(), color, "#FFFFFF", icon);
              
              // Extract commit information if available
              const commitInfo = wf.head_commit?.message || 'N/A';
              const commitAuthor = wf.head_commit?.author?.name || actor.login;
              
              // Simplified message format for workflow runs to avoid API compatibility issues
              message = {
                cards: [{
                  header: {
                    title: `${wf.conclusion.toUpperCase()} - Workflow: ${wf.name}`,
                    subtitle: `Repository: ${payload.repository.full_name}`,
                    imageUrl: actor.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(actor.login)}&size=128`,
                    imageStyle: "AVATAR"
                  },
                  sections: [
                    {
                      widgets: [
                        {
                          keyValue: {
                            topLabel: "Triggered by",
                            content: actor.login,
                            icon: "PERSON"
                          }
                        },
                        {
                          keyValue: {
                            topLabel: "Branch",
                            content: wf.head_branch
                          }
                        },
                        {
                          keyValue: {
                            topLabel: "Commit",
                            content: commitInfo
                          }
                        },
                        {
                          keyValue: {
                            topLabel: "Status",
                            content: wf.conclusion
                          }
                        },
                        {
                          keyValue: {
                            topLabel: "Duration",
                            content: formattedDuration
                          }
                        }
                      ]
                    },
                    {
                      widgets: [
                        {
                          buttons: [
                            {
                              textButton: {
                                text: "View Details",
                                onClick: {
                                  openLink: {
                                    url: wf.html_url
                                  }
                                }
                              }
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }]
              };
            }

            else if (eventName === 'deployment' || eventName === 'deployment_status') {
              const deployment = payload.deployment || payload.deployment_status;
              const repository = payload.repository;
              const sender = payload.sender;
              
              // Determine deployment status and color
              let statusText, statusIcon, color;
              const deploymentState = deployment.state || deployment.status || payload.deployment_status?.state;
              
              switch (deploymentState) {
                case 'success':
                  statusText = 'DEPLOYED';
                  statusIcon = '🚀';
                  color = '#2CBE4E';
                  break;
                case 'failure':
                case 'error':
                  statusText = 'FAILED';
                  statusIcon = '❌';
                  color = '#EA4335';
                  break;
                case 'in_progress':
                case 'pending':
                  statusText = 'DEPLOYING';
                  statusIcon = '🔧';
                  color = '#F0B400';
                  break;
                case 'inactive':
                  statusText = 'INACTIVE';
                  statusIcon = '⚠️';
                  color = '#EA4335';
                  break;
                default:
                  statusText = (deploymentState || 'UNKNOWN').toUpperCase();
                  statusIcon = '📦';
                  color = '#4285F4';
              }
              
              const statusBadge = createBadge(statusText, color, "#FFFFFF", statusIcon);
              
              const details = [
                ['Environment', deployment.environment || 'production'],
                ['Deployer', sender?.login || deployment.creator?.login || 'Unknown'],
                ['Created', formatTimestamp(deployment.created_at)],
                ['Status', statusText],
              ];
              
              // Add completion time for finished deployments
              if (deploymentState === 'success' || deploymentState === 'failure') {
                if (deployment.updated_at) {
                  details.push(['Completed', formatTimestamp(deployment.updated_at)]);
                  const duration = formatDuration(deployment.created_at, deployment.updated_at);
                  if (duration !== 'N/A') {
                    details.push(['Duration', duration]);
                  }
                }
              }
              
              // Add branch/commit info if available
              if (deployment.ref) {
                details.push(['Branch/Ref', deployment.ref]);
              }
              if (deployment.sha) {
                details.push(['Commit', deployment.sha.substring(0, 8)]);
              }
              
              const buttons = [];
              if (deployment.target_url || payload.deployment_status?.target_url) {
                buttons.push({
                  textButton: {
                    text: "🌐 VIEW DEPLOYMENT",
                    onClick: { openLink: { url: deployment.target_url || payload.deployment_status.target_url } }
                  }
                });
              }
              
              if (deployment.log_url || payload.deployment_status?.log_url) {
                buttons.push({
                  textButton: {
                    text: "📋 VIEW LOGS",
                    onClick: { openLink: { url: deployment.log_url || payload.deployment_status.log_url } }
                  }
                });
              }
              
              message = createCard(
                `${statusBadge} Deployment - ${repository.name}`,
                `Environment: ${deployment.environment || 'production'}`,
                details,
                color,
                buttons,
                sender?.avatar_url
              );
            }

            // Helper function to determine contrast color for badges
            function getContrastColor(hexColor) {
              // Convert hex to RGB
              const r = parseInt(hexColor.slice(1, 3), 16);
              const g = parseInt(hexColor.slice(3, 5), 16);
              const b = parseInt(hexColor.slice(5, 7), 16);
              
              // Calculate luminance using standard formula
              const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
              
              // Use white text for dark backgrounds, black for light backgrounds
              return luminance > 0.5 ? "#000000" : "#FFFFFF";
            }

            // Generate visual bar for additions/deletions
            function generateDiffBar(additions, deletions) {
              const total = additions + deletions;
              if (total === 0) return '';
              
              const addPercent = Math.round((additions / total) * 100);
              const delPercent = 100 - addPercent;
              
              return `<br><font color="#2cbe4e">■</font><font color="#2cbe4e">${'■'.repeat(Math.floor(addPercent/5))}</font><font color="#cb2431">${'■'.repeat(Math.floor(delPercent/5))}</font><font color="#cb2431">■</font>`;
            }

            // Generate visual bar for workflow duration
            function generateDurationBar(durationMs) {
              // Scale based on duration (arbitrary scale for visualization)
              const seconds = durationMs / 1000;
              let barLength;
              
              if (seconds < 10) barLength = 1;
              else if (seconds < 30) barLength = 2;
              else if (seconds < 60) barLength = 3;
              else if (seconds < 120) barLength = 5;
              else if (seconds < 300) barLength = 7;
              else barLength = 10;
              
              return `<br>${'▰'.repeat(barLength)}${'▱'.repeat(10-barLength)}`;
            }

            // Generate bar for file changes
            function generateFileChangesBar(commits) {
              let added = 0, modified = 0, removed = 0;
              
              commits.forEach(commit => {
                added += (commit.added || []).length;
                modified += (commit.modified || []).length;
                removed += (commit.removed || []).length;
              });
              
              const total = added + modified + removed;
              if (total === 0) return '';
              
              const addedStr = added > 0 ? `<font color="#2cbe4e">+${added}</font> ` : '';
              const modifiedStr = modified > 0 ? `<font color="#f0b400">~${modified}</font> ` : '';
              const removedStr = removed > 0 ? `<font color="#cb2431">-${removed}</font>` : '';
              
              return `<br>${addedStr}${modifiedStr}${removedStr}`;
            }

            // Send notification with retry logic
            try {
              console.log('Sending notification for event:', eventName);
              // For debugging, log a simplified version of the payload
              console.log('Message type:', typeof message);
              console.log('Message structure:', JSON.stringify({
                messageType: 'Google Chat message',
                hasCards: !!message.cards,
                cardCount: message.cards ? message.cards.length : 0
              }));
              
              const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                body: JSON.stringify(message),
                headers: { 'Content-Type': 'application/json' }
              });
              
              const responseText = await response.text();
              
              if (!response.ok) {
                console.error(`Error sending notification: ${response.status} - ${responseText}`);
                console.error('Message structure causing error:', JSON.stringify(message, null, 2).substring(0, 500) + '...');
                
                // Retry with simplified message
                console.log('Retrying with simplified message...');
                const simplifiedMessage = {
                  text: `GitHub ${eventName} event: ${
                    eventName === 'workflow_run' ? 
                      `Workflow "${payload.workflow_run.name}" ${payload.workflow_run.conclusion}` : 
                      `See details at ${
                        eventName === 'push' ? payload.repository.html_url :
                        eventName === 'pull_request' ? payload.pull_request.html_url :
                        eventName === 'issues' ? payload.issue.html_url :
                        payload.repository.html_url
                      }`
                  }`
                };
                
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                const retryResponse = await fetch(WEBHOOK_URL, {
                  method: 'POST',
                  body: JSON.stringify(simplifiedMessage),
                  headers: { 'Content-Type': 'application/json' }
                });
                
                const retryResponseText = await retryResponse.text();
                
                if (!retryResponse.ok) {
                  console.error(`Retry failed: ${retryResponse.status} - ${retryResponseText}`);
                } else {
                  console.log('Notification sent successfully after retry with simplified message');
                }
              } else {
                console.log('Notification sent successfully');
              }
            } catch (error) {
              console.error(`Exception sending notification: ${error.message}`);
              console.error(error.stack);
            }
